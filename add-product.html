<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มสินค้าใหม่</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">StockManager</div>
        <ul class="nav-links">
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="products.html">รายการสินค้า</a></li>
            <li><a href="add-product.html" class="active">เพิ่มสินค้า</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="form-card">
            <h1>เพิ่มสินค้าใหม่</h1>
            <form id="add-product-form">
                <div class="form-group">
                    <label for="name">ชื่อสินค้า</label>
                    <input type="text" id="name" required placeholder="เช่น สมุดโน้ต">
                </div>
                <div class="form-group">
                    <label for="price">ราคา (บาท)</label>
                    <input type="number" id="price" min="0" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="quantity">จำนวน</label>
                    <input type="number" id="quantity" min="1" required placeholder="1">
                </div>
                <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
            </form>
        </div>
    </main>

    <script src="js/validation.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
